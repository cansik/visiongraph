name: PR Validation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Quick Validation (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: make sync

      - name: Regenerate repository artifacts
        run: |
          make generate-artifacts

      - name: Verify generated files are up to date
        run: |
          git diff --exit-code -- visiongraph/vg/__init__.py MODEL_ATTRIBUTIONS.md

      - name: Run routine tests
        run: make test-routine

      - name: Build documentation
        run: |
          make docs

      - name: Build distributable artifacts
        run: |
          make build
