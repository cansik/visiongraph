name: PR Validation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Quick Validation (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: |
          uv sync --dev --group docs

      - name: Regenerate repository artifacts
        run: |
          make generate-artifacts

      - name: Verify generated files are up to date
        run: |
          git diff --exit-code -- visiongraph/vg/__init__.py MODEL_ATTRIBUTIONS.md

      - name: Check repository asset metadata
        run: |
          make test-metadata

      - name: Run quick unit tests
        run: |
          uv run python -m unittest tests.test_lazy_import tests.test_graph_node tests.test_repo_maintenance_scripts -v

      - name: Build documentation
        run: |
          make docs

      - name: Build distributable artifacts
        run: |
          make build
