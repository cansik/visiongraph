name: Visiongraph Test

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        matrix:
          os:
            - name: windows
              host: windows-latest
              args:

            - name: macos
              host: macos-12
              args:

            - name: ubuntu
              host: ubuntu-latest
              args:
        python-version: [ '3.8', '3.9', '3.10' ]

    runs-on: ${{ matrix.os.host }}

    name: python ${{ matrix.python-version }} on ${{ matrix.os.host }}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      # install pip packages
      - name: Install visiongraph
        run: |
          cd $GITHUB_WORKSPACE
          pip install ".[all]"

      # run test
      - name: Test visiongraph
        run: |
          cd $GITHUB_WORKSPACE
          python -m unittest discover -s ./tests -t ./