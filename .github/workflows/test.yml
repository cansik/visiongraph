name: Visiongraph Test

on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: windows
            host: windows-latest
            args:

          - name: macos
            host: macos-12
            args:

          - name: ubuntu
            host: ubuntu-latest
            args:
        python-version: [ '3.8', '3.9', '3.10' ]

    runs-on: ${{ matrix.os.host }}

    name: python ${{ matrix.python-version }} on ${{ matrix.os.host }}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      # install pip packages
      - name: Install visiongraph
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE
          pip install --upgrade pip
          pip install -r dev-requirements.txt
          pip install .[all]

      - name: "Download all networks from ${{ github.event.inputs.tag }}"
        uses: robinraju/release-downloader@v1.8
        with:
          repository: "cansik/data-storage"
          tag: "sarmotion"
          fileName: "*"
          out-file-path: "visiongraph/cache"
          token: ${{ secrets.GITHUB_TOKEN }}

      # check networks
      - name: Check networks
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE
          ls -la visiongraph/cache

      # run test
      - name: Test visiongraph
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE
          python -m unittest discover -s ./tests -t ./