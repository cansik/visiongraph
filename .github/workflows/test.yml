name: Visiongraph Test

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        default: routine
        options:
          - routine
          - inference
          - full

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.suite == 'inference' && '["ubuntu-latest"]' || '["windows-latest","macos-latest","ubuntu-latest"]') }}
        python-version: ${{ fromJSON(inputs.suite == 'inference' && '["3.13"]' || '["3.11","3.12","3.13"]') }}

    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      VISIONGRAPH_ASSET_DIR: build/test-assets

    name: ${{ inputs.suite }} / Python ${{ matrix.python-version }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux prerequisites
        if: inputs.suite != 'routine' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgles2

      - name: Install ffmpeg
        if: inputs.suite != 'routine' && runner.os == 'macOS'
        run: |
          brew install ffmpeg

      - name: Install visiongraph
        shell: bash
        run: |
          pip install uv
          uv sync --locked --extra all --dev --group docs

      - name: Get model mirror revision
        if: inputs.suite != 'routine'
        id: model-revision
        shell: bash
        run: |
          revision="$(git ls-remote --exit-code https://huggingface.co/cansik/visiongraph refs/heads/main | cut -f1)"
          printf 'sha=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Restore model assets
        if: inputs.suite != 'routine'
        id: model-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.VISIONGRAPH_ASSET_DIR }}
          key: visiongraph-models-v2-${{ steps.model-revision.outputs.sha }}-${{ hashFiles('tests/test_*.py', 'visiongraph/estimator/**/*.py') }}
          restore-keys: |
            visiongraph-models-v2-${{ steps.model-revision.outputs.sha }}-
          enableCrossOsArchive: true

      - name: Run routine tests
        if: inputs.suite == 'routine'
        run: uv run --no-sync python -X faulthandler -m unittest tests.routine -v

      - name: Run full tests
        if: inputs.suite != 'routine'
        run: uv run --no-sync python -X faulthandler -m unittest discover -s ./tests -t ./ -v

      - name: Save model assets
        if: inputs.suite != 'routine' && runner.os == 'Linux' && matrix.python-version == '3.13' && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.VISIONGRAPH_ASSET_DIR }}
          key: ${{ steps.model-cache.outputs.cache-primary-key }}
          enableCrossOsArchive: true
