name: Visiongraph Test

on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: windows
            host: windows-latest
            args:

          - name: macos-intel
            host: macos-13
            args:

          - name: macos-silicon
            host: macos-14
            args:

          - name: ubuntu
            host: ubuntu-latest
            args:
        python-version: [ '3.10', '3.11' ]

    runs-on: ${{ matrix.os.host }}

    name: python ${{ matrix.python-version }} on ${{ matrix.os.host }}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      # install os specific
      - name: Install ffmpeg
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg

      # install pip packages
      - name: Install visiongraph
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE
          pip install uv
          uv sync --all-extras --dev

      - name: "Download all networks from ${{ github.event.inputs.tag }}"
        uses: robinraju/release-downloader@v1.8
        with:
          repository: "cansik/data-storage"
          tag: "sarmotion"
          fileName: "*"
          out-file-path: "visiongraph/cache"
          token: ${{ secrets.DATA_REPO_TOKEN }}

      # check networks
      - name: Check networks
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE
          ls -la visiongraph/cache

      # run test
      - name: Test visiongraph
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE
          uv run python -m unittest discover -s ./tests -t ./ -v