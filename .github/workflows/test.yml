name: Visiongraph Test

on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: windows
            host: windows-latest
            args:

          - name: macos-silicon
            host: macos-latest
            args:

          - name: ubuntu
            host: ubuntu-latest
            args:
        python-version: ["3.10", "3.11"]

    runs-on: ${{ matrix.os.host }}

    name: python ${{ matrix.python-version }} on ${{ matrix.os.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg

      - name: Install visiongraph
        shell: bash
        run: |
          pip install uv "huggingface_hub[cli]"
          uv sync --all-extras --dev

      - name: Download all models from Hugging Face
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_HUB_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="cansik/visiongraph",
              local_dir="visiongraph/cache"
          )
          EOF

      - name: Check networks
        shell: bash
        run: |
          ls -la visiongraph/cache

      - name: Test visiongraph
        shell: bash
        run: |
          uv run python -m unittest discover -s ./tests -t ./ -v
