[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "visiongraph"
version = "1.2.0"
description = "Visiongraph is a computer vision pipeline that provides ready-to-use modules for quick prototyping of image-based algorithms."
readme = "README.md"
license = "MIT"

authors = [
    { name = "Florian Bruggisser", email = "github@broox.ch" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10,<3.13"

dependencies = [
    "requests",
    "tqdm",
    "vector~=1.6.3",
    "scipy",
    "numpy>2",
    "opencv-python~=4.7.0; python_version <= '3.9'",
    "opencv-python~=4.12; python_version > '3.9'",
]

[project.urls]
Homepage = "https://github.com/cansik/visiongraph"
Documentation = "https://cansik.github.io/visiongraph/"
Repository = "https://github.com/cansik/visiongraph.git"

[dependency-groups]
dev = [
    "pytest",
    "ty>=0.0.1a20",
    "ruff>=0.12.0",
]

docs = [
    "pdoc~=15.0.4",
    "tomli>=2.4.0; python_version < '3.11'",
]

[project.optional-dependencies]
all = [
    "visiongraph[realsense]",
    "visiongraph[azure]",
    "visiongraph[depthai]",
    "visiongraph[openvino]",
    "visiongraph[mediapipe]",
    "visiongraph[onnx]",
    "visiongraph[media]",
    "visiongraph[numba]",
    "visiongraph[fbs]",
    "visiongraph[faiss]",
    "visiongraph[mot]",
]

realsense = [
    "pyrealsense2-macosx~=2.56.5; platform_system == 'Darwin'",
    "pyrealsense2~=2.56.5; platform_system != 'Darwin'",
]

azure = [
    "pyk4a-bundle~=1.5.0.1; platform_system == 'Windows' or platform_system == 'Linux'",
]

depthai = [
    "depthai~=2.30; platform_system != 'Darwin' or platform.machine == 'arm64'",
]

openvino = ["openvino~=2025.4.1"]

mediapipe = [
    # currently we use a custom mediapipe package
    # see https://github.com/google-ai-edge/mediapipe/issues/5612
    "mediapipe-numpy2~=0.10.21"
]

onnx = ["onnxruntime~=1.23.0"]

"onnx-gpu" = [
    "onnxruntime~=1.23.0; platform_system == 'Darwin'",
    "onnxruntime-gpu~=1.23.0; platform_system != 'Darwin'",
]

"onnx-directml" = [
    "onnxruntime~=1.23.0; platform_system == 'Darwin' or platform_system == 'Linux'",
    "onnxruntime-directml~=1.23.0; platform_system == 'Windows'",
]

media = [
    "moviepy",
    "vidgear[core]~=0.3.3",
]

numba = ["numba~=0.61"]

fbs = [
    "pyopengl; platform_system == 'Darwin' or platform_system == 'Windows'",
    "syphon-python~=0.1.1; platform_system == 'Darwin'",
    "SpoutGL~=0.1.1; platform_system == 'Windows'",
]

faiss = ["faiss-cpu"]

mot = ["filterpy"]

[tool.uv]
override-dependencies = [
    # see https://github.com/google-ai-edge/mediapipe/issues/5612
    # "numpy>2"
]

[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4
respect-gitignore = true

exclude = [
    "visiongraph/external"
]

[tool.ruff.lint]
# select = ["FA100", "UP006"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

docstring-code-format = true

exclude = [
    "visiongraph/vg/__init__.py"
]

[tool.hatch.build.targets.wheel]
packages = ["visiongraph"]

[tool.hatch.build.targets.wheel.force-include]
"DOCUMENTATION.md" = "DOCUMENTATION.md"
"MODEL_ATTRIBUTIONS.md" = "MODEL_ATTRIBUTIONS.md"
"THIRD_PARTY_NOTICES.md" = "THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = [
    "/visiongraph",
    "/scripts",
    "/tests",
    "/doc",
    "/README.md",
    "/DOCUMENTATION.md",
    "/MODEL_ATTRIBUTIONS.md",
    "/THIRD_PARTY_NOTICES.md",
    "/LICENSE",
    "/pyproject.toml",
    "/CITATION.cff",
    "/MODEL_LICENSES.md",
    "/MODELS.md",
]
