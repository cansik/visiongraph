[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "visiongraph"
version = "1.3.0"
description = "Visiongraph is a computer vision pipeline that provides ready-to-use modules for quick prototyping of image-based algorithms."
readme = "README.md"
license = "MIT"

authors = [
    { name = "Florian Bruggisser", email = "github@broox.ch" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"

dependencies = [
    "requests",
    "tqdm",
    "vector~=1.9.0",
    "scipy",
    "numpy>2",
    "opencv-contrib-python~=4.12",
]

[project.urls]
Homepage = "https://github.com/cansik/visiongraph"
Documentation = "https://cansik.github.io/visiongraph/"
Repository = "https://github.com/cansik/visiongraph.git"

[dependency-groups]
dev = [
    "pytest",
    "ty>=0.0.1a20",
    "ruff>=0.12.0",
]

docs = [
    "pdoc~=16.0.0",
]

[project.optional-dependencies]
all = [
    "visiongraph[realsense]",
    "visiongraph[azure]",
    "visiongraph[depthai]",
    "visiongraph[openvino]",
    "visiongraph[mediapipe]",
    "visiongraph[onnx]",
    "visiongraph[media]",
    "visiongraph[numba]",
    "visiongraph[fbs]",
    "visiongraph[faiss]",
    "visiongraph[mot]",
]

realsense = [
    "pyrealsense2-macosx~=2.56.5; platform_system == 'Darwin'",
    "pyrealsense2~=2.59.1; platform_system != 'Darwin'",
]

azure = [
    "pyk4a-bundle~=1.5.0.1; platform_system == 'Windows' or platform_system == 'Linux'",
]

depthai = [
    "depthai~=2.30; platform_system != 'Darwin' or platform.machine == 'arm64'",
]

openvino = ["openvino>=2025.4.1,<2027"]

mediapipe = ["mediapipe~=1.2.3"]

onnx = ["onnxruntime>=1.23.2,<2"]

"onnx-gpu" = [
    "onnxruntime>=1.23.2,<2; platform_system == 'Darwin'",
    "onnxruntime-gpu~=1.32.0; platform_system != 'Darwin'",
]

"onnx-directml" = [
    "onnxruntime>=1.23.2,<2; platform_system == 'Darwin' or platform_system == 'Linux'",
    "onnxruntime-directml~=1.24.4; platform_system == 'Windows'",
]

media = ["vidgear[core]~=0.3.7"]

numba = ["numba~=0.61"]

fbs = [
    "pyopengl; platform_system == 'Darwin' or platform_system == 'Windows'",
    "syphon-python~=0.2.0; platform_system == 'Darwin'",
    "SpoutGL~=0.1.1; platform_system == 'Windows'",
]

faiss = ["faiss-cpu"]

mot = ["filterpy"]

[tool.uv]
# dependency cooldown
exclude-newer = "1 week"

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4
respect-gitignore = true

exclude = [
    "visiongraph/external"
]

[tool.ruff.lint]
# select = ["FA100", "UP006"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

docstring-code-format = true

exclude = [
    "visiongraph/vg/__init__.py"
]

[tool.hatch.build.targets.wheel]
packages = ["visiongraph"]

[tool.hatch.build.targets.wheel.force-include]
"DOCUMENTATION.md" = "DOCUMENTATION.md"
"MODEL_ATTRIBUTIONS.md" = "MODEL_ATTRIBUTIONS.md"
"THIRD_PARTY_NOTICES.md" = "THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = [
    "/visiongraph",
    "/scripts",
    "/tests",
    "/doc",
    "/README.md",
    "/DOCUMENTATION.md",
    "/MODEL_ATTRIBUTIONS.md",
    "/THIRD_PARTY_NOTICES.md",
    "/LICENSE",
    "/pyproject.toml",
    "/CITATION.cff",
]
